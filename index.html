<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Office Runner">
<title>Office Runner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surface:#161616;--surface2:#1e1e1e;--surface3:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#e8e8e8;--text2:#888;--text3:#555;
  --green:#4ade80;--green-dim:#1a3d27;
  --amber:#fbbf24;--amber-dim:#3d2e0a;
  --blue:#60a5fa;--blue-dim:#0f2040;
  --purple:#a78bfa;--purple-dim:#1e1535;
  --font-mono:'DM Mono',monospace;
  --font-body:'Noto Sans JP',sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.6}
.app{max-width:600px;margin:0 auto;padding:1.5rem 1rem 6rem}
.header{display:flex;align-items:flex-start;gap:12px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.header-left{flex:1}
.header-title{font-family:var(--font-mono);font-size:11px;color:var(--text3);letter-spacing:0.12em;margin-bottom:2px}
.header-date{font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--text)}
.header-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btn-tab{font-family:var(--font-mono);font-size:11px;padding:6px 13px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;-webkit-appearance:none}
.btn-tab.active{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.stat-val{font-family:var(--font-mono);font-size:22px;font-weight:500}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:0.08em}
.progress-bar{height:2px;background:var(--border);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease}
.section-header{display:flex;align-items:center;gap:8px;margin:1.2rem 0 0.5rem}
.section-label{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:0.1em;white-space:nowrap}
.section-line{flex:1;height:1px;background:var(--border)}
.todo-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px;border-radius:8px;margin-bottom:5px;cursor:pointer;user-select:none;transition:background 0.12s}
.todo-row:active{background:var(--surface2)}
.todo-row.done{opacity:0.38}
.todo-row.done .todo-text{text-decoration:line-through;color:var(--text3)}
.todo-illus{width:48px;height:48px;flex-shrink:0;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.todo-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.todo-text{font-size:13px;color:var(--text);line-height:1.4}
.todo-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cb{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.cb.checked{background:var(--green);border-color:var(--green);color:#000}
.cat-badge{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:3px;white-space:nowrap}
.cat-run{background:var(--green-dim);color:var(--green)}
.cat-body{background:var(--purple-dim);color:var(--purple)}
.cat-water{background:var(--blue-dim);color:var(--blue)}
.cat-work{background:var(--surface3);color:var(--text2)}
.cat-lunch{background:var(--amber-dim);color:var(--amber)}
.note-area{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.note-label{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:0.1em;margin-bottom:8px}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:14px;padding:12px;resize:vertical;min-height:90px;outline:none;line-height:1.6;-webkit-appearance:none}
textarea:focus{border-color:var(--border2)}
.save-row{display:flex;justify-content:flex-end;align-items:center;margin-top:8px;gap:10px}
.saved-msg{font-family:var(--font-mono);font-size:11px;color:var(--green);opacity:0;transition:opacity 0.3s}
.saved-msg.show{opacity:1}
.btn-save{font-family:var(--font-mono);font-size:12px;padding:9px 22px;background:var(--green-dim);color:var(--green);border:1px solid var(--green-dim);border-radius:6px;cursor:pointer;-webkit-appearance:none}
.btn-save:active{background:var(--green);color:#000}

/* STATS VIEW */
.stats-view{display:none}
.stats-view.active{display:block}

/* Weekly graph */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.chart-title{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:0.1em;margin-bottom:14px}
.week-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-bottom:24px;position:relative}
.week-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.week-bar-bg{flex:1;width:100%;background:var(--surface2);border-radius:4px;position:relative;overflow:hidden;min-height:4px}
.week-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:4px;transition:height 0.5s ease}
.week-day{font-family:var(--font-mono);font-size:9px;color:var(--text3);text-align:center}
.week-pct{font-family:var(--font-mono);font-size:9px;color:var(--text2);text-align:center;min-height:12px}
.week-avg{font-family:var(--font-mono);font-size:11px;color:var(--text2);text-align:right;margin-top:8px}
.week-avg span{color:var(--green);font-size:13px}

/* Category chart */
.cat-chart{display:flex;flex-direction:column;gap:10px}
.cat-row{display:flex;align-items:center;gap:10px}
.cat-name{font-family:var(--font-mono);font-size:11px;width:36px;flex-shrink:0}
.cat-bar-bg{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.cat-pct-lbl{font-family:var(--font-mono);font-size:11px;width:36px;text-align:right;flex-shrink:0}
.cat-detail{font-size:11px;color:var(--text3);text-align:right;margin-top:2px}

/* Streak */
.streak-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.streak-num{font-family:var(--font-mono);font-size:36px;font-weight:500;color:var(--amber);line-height:1}
.streak-info{flex:1}
.streak-lbl{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:0.1em}
.streak-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* HISTORY VIEW */
.history-view{display:none}
.history-view.active{display:block}
.today-view.hidden{display:none}
.hist-empty{font-family:var(--font-mono);font-size:12px;color:var(--text3);text-align:center;padding:3rem 0}
.hist-day{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.hist-day-header{display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;user-select:none}
.hist-day-header:active{background:var(--surface2)}
.hist-date{font-family:var(--font-mono);font-size:13px;font-weight:500;flex:1}
.hist-count{font-family:var(--font-mono);font-size:11px;color:var(--text3)}
.hist-pct{font-family:var(--font-mono);font-size:12px;color:var(--green);min-width:38px;text-align:right}
.hist-bar{height:2px;background:var(--border);margin:0 14px}
.hist-bar-fill{height:100%;background:var(--green)}
.hist-body{padding:12px 14px;border-top:1px solid var(--border);display:none}
.hist-body.open{display:block}
.hist-note{font-size:12px;color:var(--text2);margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:6px;white-space:pre-wrap;border-left:2px solid var(--border2);line-height:1.6}
.hist-items{display:flex;flex-wrap:wrap;gap:4px}
.hist-item{font-size:11px;padding:3px 8px;border-radius:3px}
.hist-item.done{background:var(--green-dim);color:var(--green)}
.hist-item.miss{background:var(--surface3);color:var(--text3);text-decoration:line-through}
.chevron{font-size:11px;color:var(--text3);transition:transform 0.2s}
.chevron.open{transform:rotate(180deg)}
.delete-btn{font-family:var(--font-mono);font-size:10px;color:var(--text3);background:transparent;border:1px solid var(--border);border-radius:3px;padding:3px 8px;cursor:pointer;-webkit-appearance:none}
.delete-btn:active{color:#E24B4A;border-color:#E24B4A}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-title">OFFICE RUNNER</div>
      <div class="header-date" id="hdate"></div>
      <div class="header-actions">
        <button class="btn-tab active" id="tab-today" onclick="showTab('today')">TODAY</button>
        <button class="btn-tab" id="tab-stats" onclick="showTab('stats')">STATS</button>
        <button class="btn-tab" id="tab-hist" onclick="showTab('history')">HISTORY</button>
      </div>
    </div>
  </div>

  <!-- TODAY -->
  <div class="today-view" id="today-view">
    <div class="summary">
      <div class="stat"><div class="stat-val" id="s-done" style="color:var(--green)">0</div><div class="stat-lbl">DONE</div></div>
      <div class="stat"><div class="stat-val" id="s-total" style="color:var(--text2)">18</div><div class="stat-lbl">TOTAL</div></div>
      <div class="stat"><div class="stat-val" id="s-pct" style="color:var(--amber)">0%</div><div class="stat-lbl">RATE</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div id="todo-list"></div>
    <div class="note-area">
      <div class="note-label">// NOTE — 今日の気づき・体感</div>
      <textarea id="note-input" placeholder="今日のオフィスでの体感、気になったこと、足の状態など..."></textarea>
      <div class="save-row">
        <span class="saved-msg" id="saved-msg">saved.</span>
        <button class="btn-save" onclick="saveDay()">SAVE DAY</button>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-view" id="stats-view">
    <!-- Streak -->
    <div class="streak-card">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-info">
        <div class="streak-lbl">CURRENT STREAK</div>
        <div class="streak-sub" id="streak-sub">連続達成日数（50%以上）</div>
      </div>
    </div>

    <!-- Weekly bar chart -->
    <div class="chart-card">
      <div class="chart-title">// WEEKLY ACHIEVEMENT RATE（直近7日）</div>
      <div class="week-chart" id="week-chart"></div>
      <div class="week-avg">7日平均 <span id="week-avg-val">—</span></div>
    </div>

    <!-- Category chart -->
    <div class="chart-card">
      <div class="chart-title">// CATEGORY BREAKDOWN（直近7日平均）</div>
      <div class="cat-chart" id="cat-chart"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-view" id="history-view">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px">
      <button class="btn-tab" onclick="exportCSV()" style="border-color:#4ade8040;color:#4ade80">CSV export</button>
    </div>
    <div id="hist-list"></div>
  </div>
</div>

const CAT={run:'足底',body:'体幹',water:'水分',work:'動作',lunch:'食事'};
const CAT_COLOR={run:'#4ade80',body:'#a78bfa',water:'#60a5fa',work:'#888780',lunch:'#fbbf24'};
const DAYS=['日','月','火','水','木','金','土'];

let checks={};
TODOS.forEach(t=>checks[t.id]=false);

function todayKey(){return new Date().toISOString().slice(0,10)}
function isoOffset(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}

function getAllKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('runner_'))keys.push(k);}
  return keys.sort();
}

function getDataForKey(k){
  const s=localStorage.getItem(k);
  return s?JSON.parse(s):null;
}

function calcPct(data){
  if(!data||!data.checks)return null;
  const done=Object.values(data.checks).filter(Boolean).length;
  return Math.round(done/TODOS.length*100);
}

function calcCatPct(data,cat){
  if(!data||!data.checks)return null;
  const items=TODOS.filter(t=>t.cat===cat);
  const done=items.filter(t=>data.checks[t.id]).length;
  return Math.round(done/items.length*100);
}

function loadToday(){
  const s=localStorage.getItem('runner_'+todayKey());
  if(s){const d=JSON.parse(s);checks=d.checks||checks;document.getElementById('note-input').value=d.note||'';}
}

function autoSave(){
  localStorage.setItem('runner_'+todayKey(),JSON.stringify({checks,note:document.getElementById('note-input').value,date:todayKey()}));
}

function saveDay(){
  autoSave();
  const m=document.getElementById('saved-msg');
  m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2000);
}

function toggle(id){checks[id]=!checks[id];autoSave();render();}

function updateStats(){
  const done=Object.values(checks).filter(Boolean).length;
  const pct=Math.round(done/TODOS.length*100);
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('s-pct').style.color=pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--text2)';
}

function render(){
  updateStats();
  let html='',last='';
  TODOS.forEach(t=>{
    if(t.sec!==last){html+=`<div class="section-header"><span class="section-label">${t.sec}</span><span class="section-line"></span></div>`;last=t.sec;}
    const done=checks[t.id];
    html+=`<div class="todo-row${done?' done':''}" onclick="toggle('${t.id}')">
      <div class="todo-illus">${ILLUS[t.id]||''}</div>
      <div class="todo-main"><div class="todo-text">${t.label}</div></div>
      <div class="todo-right"><div class="cb${done?' checked':''}">${done?'✓':''}</div><span class="cat-badge cat-${t.cat}">${CAT[t.cat]}</span></div>
    </div>`;
  });
  document.getElementById('todo-list').innerHTML=html;
}

function renderStats(){
  // 直近7日のデータ収集
  const days=[];
  for(let i=-6;i<=0;i++){
    const iso=isoOffset(i);
    const k='runner_'+iso;
    const data=getDataForKey(k);
    const pct=calcPct(data);
    const d=new Date(iso+'T00:00:00');
    days.push({iso,pct,dayLabel:DAYS[d.getDay()],data});
  }

  // Streak計算
  let streak=0;
  const allKeys=getAllKeys().reverse();
  for(const k of allKeys){
    const data=getDataForKey(k);
    const pct=calcPct(data);
    if(pct!==null&&pct>=50)streak++;
    else break;
  }
  document.getElementById('streak-num').textContent=streak;
  document.getElementById('streak-sub').textContent=streak>0?`${streak}日連続達成中（50%以上）`:'まだ記録がありません';

  // Week chart
  const validPcts=days.filter(d=>d.pct!==null).map(d=>d.pct);
  const avg=validPcts.length?Math.round(validPcts.reduce((a,b)=>a+b,0)/validPcts.length):null;
  document.getElementById('week-avg-val').textContent=avg!==null?avg+'%':'—';

  let whtml='';
  days.forEach(d=>{
    const pct=d.pct;
    const color=pct===null?'#333':pct>=80?'#4ade80':pct>=50?'#fbbf24':'#E24B4A';
    const height=pct===null?0:pct;
    const isToday=d.iso===todayKey();
    whtml+=`<div class="week-bar-wrap">
      <div class="week-pct">${pct!==null?pct+'%':''}</div>
      <div class="week-bar-bg" style="${isToday?'border:1px solid #4ade8040;border-radius:4px':''}">
        <div class="week-bar-fill" style="height:${height}%;background:${color}"></div>
      </div>
      <div class="week-day" style="color:${isToday?'#4ade80':'#555'}">${d.dayLabel}${isToday?'●':''}</div>
    </div>`;
  });
  document.getElementById('week-chart').innerHTML=whtml;

  // Category breakdown (直近7日平均)
  const cats=Object.keys(CAT);
  let chtml='';
  cats.forEach(cat=>{
    const pcts=days.map(d=>calcCatPct(d.data,cat)).filter(p=>p!==null);
    const avg7=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):null;
    const color=CAT_COLOR[cat];
    const itemCount=TODOS.filter(t=>t.cat===cat).length;
    chtml+=`<div class="cat-row">
      <span class="cat-name" style="color:${color}">${CAT[cat]}</span>
      <div class="cat-bar-bg">
        <div class="cat-bar-fill" style="width:${avg7||0}%;background:${color}"></div>
      </div>
      <span class="cat-pct-lbl" style="color:${avg7===null?'#555':avg7>=80?color:avg7>=50?'#fbbf24':'#E24B4A'}">${avg7!==null?avg7+'%':'—'}</span>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:-6px;margin-bottom:4px">
      <span style="font-family:var(--font-mono);font-size:9px;color:var(--text3)">${itemCount}項目 / 7日平均</span>
    </div>`;
  });
  document.getElementById('cat-chart').innerHTML=chtml;
}

function showTab(tab){
  document.getElementById('today-view').classList.toggle('hidden',tab!=='today');
  document.getElementById('stats-view').classList.toggle('active',tab==='stats');
  document.getElementById('history-view').classList.toggle('active',tab==='history');
  document.getElementById('tab-today').classList.toggle('active',tab==='today');
  document.getElementById('tab-stats').classList.toggle('active',tab==='stats');
  document.getElementById('tab-hist').classList.toggle('active',tab==='history');
  if(tab==='stats')renderStats();
  if(tab==='history')renderHistory();
}

function toggleHist(uid){
  document.getElementById(uid).classList.toggle('open');
  document.getElementById('chev-'+uid).classList.toggle('open');
}

function deleteDay(key,e){
  e.stopPropagation();
  if(confirm('この日の記録を削除しますか？')){localStorage.removeItem(key);renderHistory();}
}

function renderHistory(){
  const keys=getAllKeys().reverse();
  const c=document.getElementById('hist-list');
  if(!keys.length){c.innerHTML='<div class="hist-empty">// no history yet</div>';return;}
  let html='';
  keys.forEach((k,idx)=>{
    const data=JSON.parse(localStorage.getItem(k));
    const done=data.checks?Object.values(data.checks).filter(Boolean).length:0;
    const pct=Math.round(done/TODOS.length*100);
    const uid='h'+idx;
    html+=`<div class="hist-day"><div class="hist-day-header" onclick="toggleHist('${uid}')"><span class="hist-date">${fmtDate(data.date||k.replace('runner_',''))}</span><span class="hist-count">${done}/${TODOS.length}</span><span class="hist-pct">${pct}%</span><button class="delete-btn" onclick="deleteDay('${k}',event)">削除</button><span class="chevron" id="chev-${uid}">▼</span></div><div class="hist-bar"><div class="hist-bar-fill" style="width:${pct}%"></div></div><div class="hist-body" id="${uid}"><div class="hist-items">`;
    TODOS.forEach(t=>{const d=data.checks&&data.checks[t.id];html+=`<span class="hist-item ${d?'done':'miss'}">${t.label}</span>`;});
    html+='</div>';
    if(data.note&&data.note.trim())html+=`<div class="hist-note">// ${data.note}</div>`;
    html+='</div></div>';
  });
  c.innerHTML=html;
}

function exportCSV(){
  const keys=getAllKeys();
  if(!keys.length){alert('エクスポートする履歴がありません');return;}

  // ヘッダー行
  const headers=['日付','曜日','達成数','合計','達成率(%)','足底(%)','体幹(%)','水分(%)','動作(%)','食事(%)'];
  TODOS.forEach(t=>headers.push(t.label));
  headers.push('Note');

  const rows=[headers.join(',')];

  keys.forEach(k=>{
    const data=JSON.parse(localStorage.getItem(k));
    if(!data)return;
    const iso=data.date||k.replace('runner_','');
    const dObj=new Date(iso+'T00:00:00');
    const weekday=DAYS[dObj.getDay()];
    const done=data.checks?Object.values(data.checks).filter(Boolean).length:0;
    const pct=Math.round(done/TODOS.length*100);
    const cats=['run','body','water','work','lunch'];
    const catPcts=cats.map(cat=>calcCatPct(data,cat)??'');
    const todoVals=TODOS.map(t=>data.checks&&data.checks[t.id]?1:0);
    const note=(data.note||'').replace(/,/g,'、').replace(/\n/g,' ');
    const row=[iso,weekday,done,TODOS.length,pct,...catPcts,...todoVals,note];
    rows.push(row.join(','));
  });

  const bom='\uFEFF';
  const csv=bom+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='office_runner_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const d=new Date();
document.getElementById('hdate').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'.');
document.getElementById('note-input').addEventListener('input',autoSave);
loadToday();
render();
